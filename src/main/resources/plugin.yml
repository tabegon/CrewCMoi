name: CrewCMoi
description: The plugin of the CrewCMoi server
author: MonsieurTh30
version: 1.0.0
api-version: '1.21'
main: fr.crewcmoi.Main
softdepend: [ItemsAdder, MythicMobs, Vault, PlaceholderAPI, Citizens, CosmeticsCore, LuckPerms]
loadbefore: [RPGhuds]

commands:
  wiki:
    description: Ouvre le wiki du serveur CrewCMoi.
    usage: /wiki
  admin:
    description: Ouvre le menu central d’administration et les outils de modération.
    aliases: [admins]
    usage: /admin [pets <joueur> <pet|all|1|2>|quest <joueur> <1|2|all>|zone ...]
  pvpgroup:
    description: Définit le groupe de punition PvP d’un joueur.
    usage: /pvpgroup <joueur> <0|1|2>
    permission: crew.admin
  reset:
    description: Réinitialise les quêtes d’un joueur.
    usage: /reset quest <joueur>
  balance:
    description: Affiche votre solde ou celui d'un autre joueur.
    usage: /balance [joueur]
    aliases: [bal]
    permission: crew.command.balance
  moneybag:
    description: Convertit une somme de ton solde en sac de pièces.
    usage: /moneybag <montant>
    permission: crew.command.moneybag
  money:
    description: Commande admin pour gérer l'argent des joueurs.
    usage: /money <add|remove|set> <joueur> <montant>
    aliases: [eco]
    permission: crew.admin
  baltop:
    description: Affiche le classement des joueurs les plus riches.
    usage: /baltop
    permission: crew.command.baltop
  sell:
    description: Ouvre une interface pour vendre vos objets.
    usage: /sell
    permission: crew.command.sell
  pay:
    description: Envoie de l'argent à un autre joueur.
    usage: /pay <joueur> <montant>
    permission: crew.command.pay
  ah:
    description: Ouvre l'hôtel des ventes. Utilise /ah sell <prix> pour vendre l'objet en main.
    usage: /ah [help|sell <prix>]
    aliases: [auctionhouse, auction]
    permission: crew.command.ah
  team:
    description: Gère votre équipe (création, invitation, acceptation, départ).
    usage: /team <create|add|accept|deny|leave|disband|info> [argument]
    aliases: [t]
    permission: crew.command.team
  bounty:
    description: Ouvre la liste des primes, en place une sur un joueur, ou (admin) valide les raisons en attente.
    usage: /bounty [add <joueur> <montant> [raison]|review]
    aliases: [prime]
    permission: crew.command.bounty
  info:
    description: Tableau de bord d'informations sur un joueur (prime, malchance, coeurs retirés).
    usage: /information bounty <joueur>
    aliases: [information, infos]
    permission: crew.staff.info
  spawn:
    description: Teleportation au spawn
    usage: /spawn
    permission: crew.command.spawn
  sethome:
    description: Definit votre home a votre position actuelle
    usage: /sethome
    permission: crew.command.sethome
  home:
    description: Teleportation vers votre home
    usage: /home
    permission: crew.command.home
  delhome:
    description: Supprime un home
    usage: /delhome <home>
    permission: crew.command.delhome
  tpa:
    description: Teleportation vers un autre joueur apres confirmation
    usage: /tpa <joueur>
    permission: crew.command.tpa
  tpahere:
    description: Teleportation d'un joueur sur soi apres confirmation
    usage: /tpahere <joueur>
    permission: crew.command.tpahere
  tpaccept:
    description: Accepte la demande de tp la plus récente.
    usage: /tpaccept
    permission: crew.command.tpaccept
  tpacceptall:
    description: Accepte toutes les demandes de téléportation récentes.
    usage: /tpacceptall
    permission: crew.command.tpacceptall
  tpacceptteam:
    description: Accepte toutes les demandes de téléportation récentes de ton équipe.
    usage: /tpacceptteam
    permission: crew.command.tpacceptteam
  claim:
    description: Réclame le chunk actuel pour empêcher les autres joueurs d'y construire/détruire.
    usage: /claim [unclaim|trust <joueur>|untrust <joueur>|info|settings|see|shop|sell <prix>|buy|ah]
    permission: crew.command.claim
  unclaim:
    description: Supprime le claim du chunk actuel.
    usage: /unclaim
    permission: crew.command.claim
  claims:
    description: Alias de /claim, notamment pour /claims settings (GUI des règles du claim).
    usage: /claims settings
    permission: crew.command.claim
  duel:
    description: Provoque un joueur en duel, avec configuration des règles (keepinventory, mise) via une GUI.
    usage: /duel <joueur>
    permission: crew.command.duel
  spectate:
    description: Observe un joueur en duel sans pouvoir être attaqué.
    usage: /spectate <joueur|stop>
    permission: crew.command.spectate
  duelaccept:
    description: Accepte (ou refuse avec "deny") la demande de duel reçue.
    usage: /duelaccept [deny]
    permission: crew.command.duelaccept
  duelarena:
    description: "Admin : configure l'arène de duel (coins, sauvegarde, restauration manuelle)."
    usage: /duelarena [1|2] <corner1|corner2|save|reset>
    permission: crew.admin
  rank:
    description: Affiche ou gère les rôles affichés dans le tab.
    usage: /rank [joueur|list|set <joueur> <rôle>|clear <joueur>]
    permission: crew.rank.set
  staff:
    description: Bascule ton mode staff (façade Vip <-> vrai rôle + inventaire dédié). "/staff info [joueur]" affiche le vrai rôle/mode staff/vanish.
    usage: /staff [info <joueur>]
    permission: crew.staff
  mute:
    description: Empêche un joueur de parler dans le chat.
    usage: /mute <joueur>
    permission: crew.admin
  unmute:
    description: Autorise de nouveau un joueur à parler dans le chat.
    usage: /unmute <joueur>
    permission: crew.admin
  vanish:
    description: Bascule le vanish. Nécessite le mode staff.
    usage: /vanish
    permission: crew.vanish
  vanishlist:
    description: Liste les joueurs actuellement en vanish. Réservé aux fondateurs.
    usage: /vanishlist
    permission: crew.vanish.list
  pets:
    description: Ouvre la collection de pets.
    usage: /pets
    permission: crew.command.pets
  shop:
    description: Ouvre les boutiques du serveur.
    usage: /shop home
    permission: crew.command.shop
  homeadmin:
    description: Affiche tous les homes du serveur.
    usage: /homeadmin
    aliases: [homesadmin]
    permission: crew.home.admin
  playeradmin:
    description: Affiche les informations détaillées de tous les joueurs.
    usage: /playeradmin
    aliases: [playersadmin]
    permission: crew.playerinfo.admin

permissions:

  crew.role.player:
    description: Rôle Player de base.
    default: true
  crew.role.vip:
    description: Rôle VIP.
    default: false
  crew.role.mod:
    description: Rôle Modérateur.
    default: false
  crew.role.dev:
    description: Rôle Développeur.
    default: false
  crew.role.fonda:
    description: Rôle Fondateur.
    default: false
  crew.role.tester:
    description: Rôle Testeur.
    default: false
  crew.role.youtubeur:
    description: Rôle YouTubeur.
    default: false

  crew.command.moneybag:
    description: Permet d'utiliser /moneybag.
    default: true
  crew.command.spectate:
    description: Permet d'observer les duels.
    default: true
  crew.command.balance:
    description: Permet d'utiliser /balance et /bal.
    default: true
  crew.command.baltop:
    description: Permet d'utiliser /baltop.
    default: true
  crew.command.sell:
    description: Permet d'utiliser /sell.
    default: true
  crew.command.pay:
    description: Permet d'utiliser /pay.
    default: true
  crew.command.ah:
    description: Permet d'utiliser /ah.
    default: true
  crew.command.team:
    description: Permet d'utiliser /team.
    default: true
  crew.command.bounty:
    description: Permet d'utiliser /bounty.
    default: true
  crew.command.spawn:
    description: Permet d'utiliser /spawn.
    default: true
  crew.command.sethome:
    description: Permet d'utiliser /sethome.
    default: true
  crew.command.home:
    description: Permet d'utiliser /home.
    default: true
  crew.command.delhome:
    description: Permet d'utiliser /delhome.
    default: true
  crew.command.tpa:
    description: Permet d'utiliser /tpa.
    default: true
  crew.command.tpahere:
    description: Permet d'utiliser /tpahere.
    default: true
  crew.command.tpaccept:
    description: Permet d'utiliser /tpaccept.
    default: true
  crew.command.tpacceptall:
    description: Permet d'utiliser /tpacceptall.
    default: true
  crew.command.tpacceptteam:
    description: Permet d'utiliser /tpacceptteam.
    default: true
  crew.command.claim:
    description: Permet d'utiliser /claim et /claims.
    default: true
  crew.command.duel:
    description: Permet d'utiliser /duel.
    default: true
  crew.command.duelaccept:
    description: Permet d'utiliser /duelaccept.
    default: true
  crew.command.pets:
    description: Permet d'utiliser /pets.
    default: true

  crew.command.shop:
    description: Permet d'utiliser /shop home.
    default: true
  crew.home.admin:
    description: Permet de consulter et téléporter vers tous les homes.
    default: false
  crew.playerinfo.admin:
    description: Permet de consulter les informations détaillées de tous les joueurs.
    default: false
  crew.staff:
    description: Permet d'utiliser /staff.
    default: false
  crew.vanish:
    description: Permet d'utiliser /vanish.
    default: false
  crew.staff.info:
    description: Permet d'utiliser /info bounty et d'inspecter les informations de prime.
    default: false
  crew.rank.set:
    description: Permet d'utiliser /rank pour attribuer ou retirer manuellement un rôle.
    default: false
  crew.admin:
    description: Permissions d'administration de l'économie, des primes et de l'arène de duel.
    default: false
  crew.balance.others:
    description: Permet de voir le solde d'un autre joueur avec /balance <joueur>.
    default: false
  crew.claim.bypass:
    description: Permet de construire/détruire librement dans n'importe quel claim.
    default: false
  crew.claim.admin:
    description: Permet de gérer n'importe quel claim (unclaim/trust/untrust/etc.).
    default: false
  crew.claim.bypasslimit:
    description: Permet de dépasser la limite configurée de claims par joueur.
    default: false
  crew.vanish.list:
    description: Permet de voir la liste des joueurs actuellement en vanish. Réservé au Fonda.
    default: false
  crew.duel.arena.bypass:
    description: Permet de casser des blocs dans l'arène de duel malgré la protection.
    default: false
