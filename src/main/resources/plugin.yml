name: CrewCMoi
description: The plugin of the CrewCMoi server
author: MonsieurTh30
version: 1.0.0
api-version: '1.21'
main: fr.crewcmoi.Main
softdepend: [ItemsAdder, Vault]
# Force CrewCMoi à s'activer avant RPGhuds, pour que le fournisseur d'économie Vault
# (VaultEconomyProvider) soit déjà enregistré quand RPGhuds essaie de le récupérer dans
# son propre onEnable() (sinon RPGhuds obtient un Economy null -> erreur "econ is null").
loadbefore: [RPGhuds]

commands:
  balance:
    description: Affiche votre solde ou celui d'un autre joueur.
    usage: /balance [joueur]
    aliases: [bal]
  money:
    description: Commande admin pour gérer l'argent des joueurs.
    usage: /money <add|remove|set> <joueur> <montant>
    aliases: [eco]
  baltop:
    description: Affiche le classement des joueurs les plus riches.
    usage: /baltop
  sell:
    description: Ouvre une interface pour vendre vos objets.
    usage: /sell
  pay:
    description: Envoie de l'argent à un autre joueur.
    usage: /pay <joueur> <montant>
  ah:
    description: Ouvre l'hôtel des ventes entre joueurs.
    usage: /ah [sell <prix>]
    aliases: [auctionhouse, auction]
  team:
    description: Gère votre équipe (création, invitation, acceptation, départ).
    usage: /team <create|add|accept|deny|leave|disband|info> [argument]
    aliases: [t]
  bounty:
    description: Ouvre la liste des primes ou en place une sur un joueur.
    usage: /bounty [add <joueur> <montant>]
    aliases: [prime]
  info:
    description: Tableau de bord d'informations sur un joueur (prime, malchance, coeurs retirés).
    usage: /information bounty <joueur>
    aliases: [information, infos]
  spawn:
    description: Teleportation au spawn
    usage: /spawn
  sethome:
    description: Definit votre home a votre position actuelle
    usage: /sethome
  home:
    description: Teleportation vers votre home
    usage: /home
  tpa:
    description: Teleportation vers un autre joueur apres confirmation
    usage: /tpa <joueur>
  tpahere:
    description: Teleportation d'un joueur sur soi
    usage: /tpahere <joueur>
  tpaccept:
    description: Acceptation d'une invition de tp
    usage: /tpaccept

permissions:
  crew.balance.others:
    description: Permet de voir le solde d'un autre joueur.
    default: op
  crew.admin:
    description: Permet d'utiliser les commandes admin d'économie.
    default: op
