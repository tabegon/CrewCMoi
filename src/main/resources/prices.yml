  STONE: 5
  DIRT: 1
  SAND: 2
  GRAVEL: 2
  OAK_LOG: 20
  COAL: 3
  IRON_INGOT: 80
  GOLD_INGOT: 120
  DIAMOND: 500
  EMERALD: 400
  NETHERITE_INGOT: 2000
  ROTTEN_FLESH: 1
  STRING: 3
  WHEAT: 10
