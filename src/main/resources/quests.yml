      hide-distance: 15.0
      line-width: 280
      text:
        - "- ᴘᴀꜱ ᴅᴇ ᴛᴘ ᴋɪʟʟ / ᴀꜰᴋ ᴋɪʟʟ / ᴋɪʟʟ ᴀᴠᴇᴄ ꜱᴛᴜꜰꜰ ᴅɪꜰ"
        - "    (ᴍᴀx ᴅᴇᴜx ᴘɪᴇ̀ᴄᴇꜱ ᴅᴇ ɴɪᴠᴇᴀᴜx ɪɴꜰᴇ́ʀɪᴇᴜʀ (𝟦 ᴘɪᴇ̀ᴄᴇꜱ ᴅɪᴀᴍᴏɴᴅꜱ ᴠꜱ 𝟤 ᴅɪᴀᴍᴏɴᴅ + 𝟤 ꜰᴇʀ))"
        - "- ᴘᴀꜱ ᴅᴇ ᴋɪʟʟ ᴇɴᴛʀᴇ ᴛᴇᴀᴍᴀᴛᴇꜱ ᴘᴏᴜʀ ᴜɴ ᴏʙᴊᴇᴄᴛɪꜰ ꜰɪɴᴀɴᴄɪᴇʀ ᴏᴜ ᴅᴇ ʀᴇꜱᴇᴛ ᴅᴇ ᴘʀɪᴍᴇꜱ"
        - "- ᴘᴀꜱ ᴅ'ᴇxᴘʟᴏɪᴛᴀᴛɪᴏɴ ᴅᴇ ʙᴜɢs ᴅᴜ ᴘʟᴜɢɪɴs"
        - "    (ᴏɴ ᴠᴏᴜꜱ ɪɴᴄɪᴛᴇ ᴀ̀ ʟᴇꜱ ʀᴇᴘᴏʀᴛᴇʀ ᴀᴜx ᴀᴅᴍɪɴs ᴘᴏᴜʀ ʀᴇ́ᴄᴜᴘᴇ́ʀᴇʀ ᴜɴ ᴄᴏꜱᴍᴇ́ᴛɪǫᴜᴇꜱ)"
        - "- ʟᴇꜱ ᴄʟᴀɪᴍꜱ ᴅᴏɪᴠᴇɴᴛ ʀᴇꜱᴛᴇʀ ᴀᴄᴄᴇꜱꜱɪʙʟᴇ ꜱᴀɴꜱ ʀɪᴇɴ ᴄᴀꜱꜱᴇʀ"
        - "- ᴘᴀꜱ ᴅᴇ ᴛᴏxɪᴄɪᴛᴇ́ / ɪɴꜱᴜʟᴛᴇꜱ / ʀᴀɢᴇʙᴀɪᴛɪɴɢ"
        - "- ᴘᴀꜱ ʟᴇ ᴅʀᴏɪᴛ ᴅᴇ ʜᴀᴄᴋ ɴɪ ᴅᴇ xʀᴀʏ"
        - "- ᴘᴀꜱ ᴅᴇ ɢʀɪᴇꜰɪɴɢ (ᴛᴜᴇʀ ᴇɴᴛɪᴛᴇ́ꜱ / ᴄᴀꜱꜱᴇʀ ʙʟᴏᴄs)"
        - "- ᴘᴀꜱ ᴅᴇ ꜱᴛʀᴇᴀᴍʜᴀᴄᴋ"
        - "ᴘꜱ: ꜱᴏʏᴇᴢ ᴄᴏɴᴛᴇɴᴛ (ɴᴇ ᴛᴜᴇᴢ ᴘᴀꜱ ᴊᴜꜱᴛᴇ ᴘᴏᴜʀ ᴇ̂ᴛʀᴇ ᴄʜɪᴀɴᴛ ꜰᴀᴜᴛ ᴜɴ ᴏʙᴊᴇᴄᴛɪꜰ ᴅᴇʀʀɪᴇ̀ʀᴇ)"
