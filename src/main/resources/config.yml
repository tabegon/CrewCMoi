# =========================================
#         Configuration EconomyPlugin
# =========================================

database:
  # Type de base de données : actuellement seul "sqlite" est implémenté dans cette base.
  # Prévu pour être extensible (ex: mysql) via l'interface DatabaseManager.
  type: sqlite

economy:
  # Solde de départ des nouveaux joueurs
  starting-balance: 100.0
  currency-symbol: " "
  allow-negative-balance: false
  auction-min-price: 1
  # Pourcentage de taxe prélevé sur chaque vente réalisée à l'hôtel des ventes (0 = aucune taxe)
  auction-tax-percent: 0

combat-log:
  duration-seconds: 30

bounty:
  server-bounty-amount: 50.0
  server-malus-amount: 50.0
  server-bounty-max-per-day: 1000

team:
  # Taille maximale d'une équipe (propriétaire inclus). 0 = illimité.
  max-members: 8

spawn:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

tpa:
  expiry-seconds: 60

duel:
  # Délai (en secondes) au bout duquel une demande de duel non traitée expire.
  expiry-seconds: 60
  # Compte à rebours (en secondes) affiché aux deux joueurs une fois téléportés
  # dans l'arène, avant que les dégâts ne soient réellement pris en compte.
  countdown-seconds: 5
  # Montant ajouté/retiré à chaque clic sur l'item "Argent en jeu" de la GUI /duel.
  bet-step: 100
  # Mise maximum autorisée. 0 = illimité.
  max-bet: 0
  # Emplacements des deux côtés de l'arène de duel. À configurer avec les
  # coordonnées réelles de ton serveur avant d'utiliser /duel.
  arena:
    pos1:
      world: test
      x: -43
      y: -60
      z: -42
      yaw: 0.0
      pitch: 0.0
    pos2:
      world: test
      x: -131
      y: -60
      z: -42
      yaw: 180.0
      pitch: 0.0

  itemsadder-id: "crewcmoi:balance_hud"
  text-id: "balance"

claims:

  max-per-player: 3
  see-radius: 5
  see-duration: 10
  shop:
    base-price: 5000
    price-increment: 2500
    max-extra: 10

coin-item:
  enabled: true
  itemsadder-id: "server:ccoin"
  value: 50.0

# Rôles affichés dans le tab (liste des joueurs), du plus haut (fonda) au plus bas
# (player) : voir fr.crewcmoi.tab. Chaque rôle est détecté automatiquement via sa
# permission (ex: "crew.role.vip"), ou attribué manuellement avec /role set
# <joueur> <rôle>. prefix et permission sont personnalisables ci-dessous ; si tu
# ne mets rien, les valeurs par défaut du plugin sont utilisées.
roles:
  fonda:
    prefix: "&6- Fonda &f"
    permission: "crew.role.fonda"
  admin:
    prefix: "&4- Admin &f"
    permission: "crew.role.admin"
  dev:
    prefix: "&d- Dev &f"
    permission: "crew.role.dev"
  mod:
    prefix: "&9- Mod &f"
    permission: "crew.role.mod"
  vip:
    prefix: "&a- Vip &f"
    permission: "crew.role.vip"
  player:
    prefix: "&7- Player &f"
    permission: "crew.role.player"
