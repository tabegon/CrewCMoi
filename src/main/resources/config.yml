# =========================================
#         Configuration EconomyPlugin
# =========================================

database:
  # Type de base de données : actuellement seul "sqlite" est implémenté dans cette base.
  # Prévu pour être extensible (ex: mysql) via l'interface DatabaseManager.
  type: sqlite

economy:
  # Solde de départ des nouveaux joueurs
  starting-balance: 100.0
  currency-symbol: " "
  allow-negative-balance: false
  auction-min-price: 1
  # Pourcentage de taxe prélevé sur chaque vente réalisée à l'hôtel des ventes (0 = aucune taxe)
  auction-tax-percent: 0

combat-log:
  duration-seconds: 30

bounty:
  server-bounty-amount: 50.0
  server-malus-amount: 50.0
  server-bounty-max-per-day: 1000
  display:
    # Hauteur (en blocs) de l'affichage flottant de la prime au-dessus des yeux du joueur.
    # Augmente cette valeur si le texte chevauche le pseudo vanilla, diminue-la pour le
    # rapprocher davantage de la tête.
    height-offset: 0.35
    # Intervalle (en ticks) auquel l'affichage flottant est repositionné sur le joueur
    # qu'il suit. 2 = fluide (10 fois/seconde), augmente si tu veux réduire la charge serveur.
    follow-interval-ticks: 2

team:
  # Taille maximale d'une équipe (propriétaire inclus). 0 = illimité.
  max-members: 8

spawn:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

tpa:
  expiry-seconds: 60

  itemsadder-id: "crewcmoi:balance_hud"
  text-id: "balance"

claims:

  max-per-player: 3
  see-radius: 5
  see-duration: 10
  shop:
    base-price: 5000
    price-increment: 2500
    max-extra: 10

coin-item:
  enabled: true
  itemsadder-id: "server:ccoin"
  value: 50.0
