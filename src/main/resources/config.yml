database:
  type: sqlite

economy:
  starting-balance: 100.0
  currency-symbol: "§f "
  allow-negative-balance: false
  auction-min-price: 1
  auction-tax-percent: 0
  auction-max-slots: 27
  auction-expire-days: 3

combat-log:
  duration-seconds: 30

player-head-drop:
  enabled: true
  price: 250.0

bounty:
  server-bounty-amount: 50.0
  server-malus-amount: 50.0
  server-bounty-max-per-day: 1000

team:
  max-members: 8

spawn:
  world: world
  x: 0.5
  y: 100.0
  z: 0.5
  yaw: 0.0
  pitch: 0.0

tpa:
  expiry-seconds: 60

duel:
  expiry-seconds: 60
  countdown-seconds: 5
  bet-step: 100
  max-bet: 0
  kits:
    basic:
      name: "Kit Classique"
      price: 5000.0
  arena:
    pos1:
      world: test
      x: -43
      y: -60
      z: -42
      yaw: 0.0
      pitch: 0.0
    pos2:
      world: test
      x: -131
      y: -60
      z: -42
      yaw: 180.0
      pitch: 0.0

  itemsadder-id: "crewcmoi:balance_hud"
  text-id: "balance"

claims:

  max-per-player: 3
  see-radius: 5
  see-duration: 10
  shop:
    base-price: 5000
    price-increment: 2500
    max-extra: 10

coin-item:
  enabled: true
  itemsadder-id: "server:ccoin"
  value: 50.0

roles:
  fonda:
    prefix: "§f "
    permission: "crew.role.fonda"
  dev:
    prefix: "§f "
    permission: "crew.role.dev"
  mod:
    prefix: "§f "
    permission: "crew.role.mod"
  vip:
    prefix: "§f "
    permission: "crew.role.vip"
  player:
    prefix: "§f "
    permission: "crew.role.player"

web:
  # Active/désactive le dashboard web admin (lecture seule) embarqué dans le plugin.
  enabled: true
  # Port d'écoute du dashboard (http://<ip-du-serveur>:<port>).
  port: 48961
  # Adresse d'écoute : "0.0.0.0" = accessible depuis tout le réseau local (recommandé
  # uniquement si ton serveur n'est pas exposé directement sur internet), "127.0.0.1"
  # = accessible uniquement depuis la machine qui héberge le serveur.
  bind-address: "0.0.0.0"


pets:
  # Item ItemsAdder (n'importe lequel) qui, au clic droit, téléporte le pet actif
  # du joueur à ses côtés et lui retire sa cible actuelle.
  recall-item-id: "server:pet_recall_charm"

  list:
    spookie_spice:
      itemsadder-id: "server:spooky_spice"
      mythic-mob: "Spooky_Spice"
      slot: 0

fisherman:
  # ID du NPC Citizens sur lequel il faut clic-droit pour ouvrir la GUI du pêcheur.
  npc-id: 4

  # Prix de vente AU pêcheur (plus élevés qu'au /sell classique du NPC 0).
  # Seuls les matériaux listés ici sont vendables dans cette GUI.
  sell-prices:
    COD: 10
    SALMON: 10
    COOKED_COD: 15
    COOKED_SALMON: 15
    PUFFERFISH: 30
    FISHING_ROD: 50

  # Prix d'achat AU pêcheur (catalogue fixe de 5 objets).
  buy-prices:
    cooked-cod: 20
    cooked-salmon: 20
    pufferfish: 30
    fishing-rod: 100
    fishing-rod-luck-of-the-sea-1: 150
