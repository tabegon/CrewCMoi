# =========================================
#         Configuration EconomyPlugin
# =========================================

database:
  # Type de base de données : actuellement seul "sqlite" est implémenté dans cette base.
  # Prévu pour être extensible (ex: mysql) via l'interface DatabaseManager.
  type: sqlite

economy:
  # Solde de départ des nouveaux joueurs
  starting-balance: 100.0

  # Symbole affiché après les montants (ex: 100.00$)
  currency-symbol: "C.coin"

  # Si true, le solde d'un joueur peut devenir négatif via /money remove
  allow-negative-balance: false

  # Prix minimum autorisé pour une mise en vente via /ah sell
  auction-min-price: 0.01

  # Pourcentage de taxe prélevé sur chaque vente réalisée à l'hôtel des ventes (0 = aucune taxe)
  auction-tax-percent: 5.0

combat-log:
  # Durée du tag de combat en secondes. Pendant ce délai, le joueur ne peut ni se
  # téléporter, ni utiliser d'élytre. Une déconnexion durant ce délai le tue.
  duration-seconds: 30

bounty:
  # Montant de la prime automatiquement attribuée par le serveur à un joueur qui tue
  # sans provocation (premier coup) une victime sans prime active.
  server-bounty-amount: 50.0

  # Malus (argent retiré) infligé à ce même joueur en plus de la prime.
  server-malus-amount: 50.0

  # Nombre maximum de fois par jour où le serveur peut attribuer prime + malus à un joueur.
  server-bounty-max-per-day: 3

team:
  # Taille maximale d'une équipe (propriétaire inclus). 0 = illimité.
  max-members: 0
