  price-increment: 5000

halloween:
  enabled: true
  table:
    price: 10000.0
    # Item ItemsAdder donné lors de l'achat et rendu lorsqu'une table est cassée.
    # Cet item doit être un item plaçable basé sur une table d'enchantement.
    itemsadder-id: "server:summoning_table"
    item-name: "&5&lTable maudite"

  # GUI du NPC marchand Halloween. Les items de cette GUI restent configurables ici.
  shop:
    size: 54
    title: "&5&lHalloween &8• &dMarchand"

    # Le fill_button n'est utilisé que dans fill-slots.
    filler:
      itemsadder-id: "server:fill_button"
      amount: 1
      display-name: " "
    fill-slots:
      - 1
      - 3
      - 46
      - 48

    # Produits achetables. Modifiez les prix selon votre économie.
    slots:
      "12":
