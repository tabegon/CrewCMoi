quest-master:
  title: "&5&lQuest Master"
  random-teleport:
    # Étoile temporaire. Remplaçable plus tard par un item custom ItemsAdder.
    material: "NETHER_STAR"
    display-name: "&d&lTéléportation aléatoire"
    lore:
      - "&7Téléporte-toi aléatoirement"
      - "&7dans le monde &equest&7."
  # Première quête : trouver l'Electric Goat, récupérer sa corne puis la rapporter.
  quest-1:
    mythic-mob: "Electric_Goat"
    compass-update-ticks: 10
    horn:
      # Item présenté au Quest Master pour terminer la quête.
      # Prioritaire sur material si renseigné.
      itemsadder-id: ""
      material: "GOAT_HORN"
    messages:
      started: "&eLa traque de l'Electric Goat commence ! &7Suis ta boussole."
      horn-obtained: "&aTu as récupéré la corne de l'Electric Goat ! &7Retourne voir le Quest Master."
      completed: "&aQuête terminée ! &7Le SellBot est maintenant accessible."
      already-completed: "&aTu as déjà terminé cette quête."
      wrong-killer: "&cTu dois battre toi-même l'Electric Goat pour obtenir sa corne."
  # Deuxième quête : le plugin gère uniquement le départ, la validation de l'objet
  # final et les récompenses. L'énigme elle-même est librement gérée par le serveur.
  quest-2:
    reward:
      # Prioritaire sur material si renseigné.
      itemsadder-id: ""
      material: "PAPER"
    messages:
      locked: "&cTu dois terminer la première quête avant de commencer celle-ci."
      started: "&eLa deuxième quête commence ! &7Résous l'énigme et rapporte l'objet au Quest Master."
      completed: "&aQuête terminée ! &7Le NPC des cosmétiques est maintenant accessible."
      already-completed: "&aTu as déjà terminé cette quête."
      world-unavailable: "&cLe monde quest n'est pas disponible."
    first-cosmetic:
      # ID exact du cosmétique déclaré dans CosmeticsCore.
      # CosmeticsCore utilise les permissions pour déterminer les cosmétiques possédés.
      id: ""
      # Débloque automatiquement le cosmétique ci-dessus avec LuckPerms.
      grant-permissions: true
      # %player% = pseudo, %uuid% = UUID, %cosmetic% = ID CosmeticsCore.
      # Ces commandes sont exécutées par la console.
      permission-commands:
        - "lp user %player% permission set cosmeticscore.user.cosmetics.seeingui.%cosmetic% true"
        - "lp user %player% permission set cosmeticscore.user.cosmetics.wear.%cosmetic% true"
      # Commandes supplémentaires optionnelles exécutées après le déblocage.
      commands: []

  slots:
    "10":
      display-name: "&a&lElectric Goat"
      lore:
        - "&7Partez à la recherche de l'Electric Goat."
        - "&7Battez-le et rapportez sa corne."
      completed:
        display-name: "&a&lElectric Goat &2✓"
        lore:
          - "&aQuête terminée !"
          - "&7Le SellBot est désormais accessible."
    "11":
      # Affichage avant la fin de la quête 1.
      display-name: "&c&lLocked Boss"
      lore:
        - "ꜰɪɴɪꜱʜ ᴛʜᴇ ᴘʀᴇᴠɪᴏᴜꜱ ᴄʜᴀʟʟʟᴀɴɢᴇ"
        - "ʙᴇꜰᴏʀᴇ ᴅᴏɪɴɢ ᴛʜɪꜱ ᴏɴᴇ"
      # Affichage après la quête 1. L'item peut être vanilla ou ItemsAdder.
      unlocked:
        itemsadder-id: ""
        material: "PAPER"
        custom-model-data: 0
        display-name: "&b&lÉnigme"
        lore:
          - "&7Résous l'énigme dans le monde quest."
          - "&7Rapporte ensuite l'objet au Quest Master."
    "12":
      display-name: "&c&lLocked Boss"
      lore:
        - "ꜰɪɴɪꜱʜ ᴛʜᴇ ᴘʀᴇᴠɪᴏᴜꜱ ᴄʜᴀʟʟʟᴀɴɢᴇ"
