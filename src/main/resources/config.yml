lootbox-teleport:
  # Clé ItemsAdder reconnue uniquement pour déclencher la téléportation.
  # La clé ItemsAdder configurée est consommée lors d'un clic droit valide.
  key-itemsadder-id: "server:halloween_crate_key"

  # Les destinations sont testées dans l'ordre : destination1 puis destination2.
  # Si un joueur se trouve dans le rayon configuré, la destination est considérée occupée.
  destinations:
    destination1:
      name: "Emplacement 1"
      world: "test"
      x: -52.0
      y: -60.0
      z: 97.0
      yaw: 0.0
      pitch: 0.0
      occupancy-radius: 5.0
    destination2:
      name: "Emplacement 2"
      world: "test"
      x: -52.0
      y: -60.0
      z: 97.0
      yaw: 0.0
      pitch: 0.0
      occupancy-radius: 5.0

  messages:
