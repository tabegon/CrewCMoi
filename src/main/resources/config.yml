# Configuration de la GUI du Sell Bot.
#
# IMPORTANT :
# - Les slots 0-3, 9-12, 18-21, 27-30 et 36-39 sont réservés aux objets déposés par le joueur.
# - Les autres slots peuvent être décorés avec n'importe quel item ItemsAdder.
# - Tous les IDs ItemsAdder sont définis ici, jamais dans le code.
# - %item-count%, %total% et %currency% sont disponibles dans les lores des boutons.
sell-gui:
  # Aucun filler ItemsAdder ici : les éléments fixes utilisent GuiItems.java.

  # Décorations personnalisées. Tous les slots sauf les slots de dépôt sont pris en compte.
  # Exemple :
  # slots:
  #   "36":
  #     itemsadder-id: "server:gui_item_1"
  #   "37":
  #     itemsadder-id: "server:gui_item_2"
  #     display-name: "&aMon bouton"
  slots: {}

  buttons:
    # Les boutons Sell / Confirm / Cancel / NPC / Search utilisent désormais
    # directement les items de GuiItems.java (Custom Model Data).
    # Seuls les emplacements et le lore du bouton Search restent configurables.
    search:
      slots:
        - 46
      item-slots:
        - 0
        - 1
        - 2
        - 3
        - 9
        - 10
        - 11
        - 12
        - 18
        - 19
        - 20
        - 21
        - 27
        - 28
        - 29
        - 30
        - 36
        - 37
        - 38
        - 39
      lore:
        - "&7Cliquez pour calculer le prix total."
        - "&7Prix total : %total%"

