lootbox:
  key-itemsadder-id: "server:lootbox_key"
  gui-title: "&5&lLootbox"
  gui-header: "&d&lOuverture de la lootbox"
  gui-footer: "&7Les récompenses arrivent..."
  messages:
    no-key: "&cVous avez besoin d'une clé de lootbox."
    empty-pool: "&cLa pool de récompenses est vide ou mal configurée."
    won: "&a☘ &fVotre lootbox est ouverte ! &7Vous avez reçu 3 récompenses."
  animation:
    duration-ticks: 80
    interval-ticks: 4
  # Chaque entrée est un item ItemsAdder. Le poids permet de régler la rareté.
  # weight: 1 = chance normale, weight: 5 = 5 fois plus fréquent qu'un weight: 1.
  # amount = quantité donnée pour chaque gain.
  pool:
    common_coins:
      itemsadder-id: "server:coin"
      amount: 3
      weight: 3
    common_item:
      itemsadder-id: "server:candy_corn"
      amount: 1
      weight: 10
    rare_item:
      itemsadder-id: "server:pumpkin_sword"
      amount: 1
      weight: 3
    second_rare_item:
      itemsadder-id: "server:pumpkin_pickaxe"
      amount: 1
      weight: 3
    third_rare_item:
      itemsadder-id: "server:pumpkin_shield"
      amount: 1
      weight: 3
    legendary_item:
      itemsadder-id: "server:spooky_spice"
      amount: 1
      weight: 1
